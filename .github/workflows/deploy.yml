name: Deploy Contract
on:
  push:
    branches:
      - main
    paths:
      - 'preprod-deployment/cli/src/launcher/deploy-voting.ts'
      - 'preprod-deployment/cli/src/midnight-wallet-provider.ts'
      - 'src/services/midnight/managed/voting/**'
      - 'contracts/voting.compact'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update & Compile Contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          compact update
          compact compile contracts/voting.compact public/keys
          compact compile contracts/voting.compact src/services/midnight/managed/voting

      - name: Install root dependencies
        run: npm install

      - name: Install preprod-deployment dependencies
        run: npm install
        working-directory: ./preprod-deployment

      - name: Install CLI dependencies
        run: npm install
        working-directory: ./preprod-deployment/cli

      - name: Run Deploy
        working-directory: ./preprod-deployment/cli
        env:
          WALLET_SEED: ${{ secrets.WALLET_SEED }}
          TS_NODE_TRANSPILE_ONLY: "1"
        run: |
          node --experimental-specifier-resolution=node --loader ts-node/esm src/launcher/deploy-voting.ts 2>&1 | tee deploy_output.log
          # Extract contract address from output
          ADDRESS=$(grep -oP 'CONTRACT_ADDRESS=\K\S+' deploy_output.log | tail -n 1)
          echo "Extracted address: $ADDRESS"
          if [ -z "$ADDRESS" ]; then
            echo "ERROR: Failed to find contract address in output"
            cat deploy_output.log
            exit 1
          fi
          echo "{\"address\": \"$ADDRESS\"}" > ../../deployed_contract.json
          cat ../../deployed_contract.json

      - name: Commit and Push deployment info
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m "chore: update deployed contract address [skip ci]"
          git push
